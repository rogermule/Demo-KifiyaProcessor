spring:
  application:
    name: paymentprocessing
  datasource:
    url: jdbc:postgresql://postgres:5432/kifiya-payment
    username: kifiya_user
    password: grace
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus